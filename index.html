<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#10b981" />
    <meta name="color-scheme" content="dark light" />
    <!-- Verificación del dominio en Meta (Business Manager → Seguridad → Dominios).
         Va en el HTML estático, NO inyectada por JS: Meta rechaza la verificación
         si la etiqueta aparece recién después de que corre el JavaScript. -->
    <meta name="facebook-domain-verification" content="kqbq6brkglaupbpizltipwlu23tiv0" />
    <title>Recurrentes</title>
    <!-- Recurrentes dejó de venderse (6-nov-2026). Nada para indexar: el sitio
         es solo el acceso al panel de los comercios que ya están andando. -->
    <meta name="robots" content="noindex, nofollow" />
    <!-- Íconos como ARCHIVOS (no data URI): Google solo muestra el favicon en los resultados si
         puede descargarlo, y pide múltiplos de 48 px. -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root">
      <noscript>
        <p>Recurrentes necesita JavaScript para funcionar.</p>
      </noscript>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
